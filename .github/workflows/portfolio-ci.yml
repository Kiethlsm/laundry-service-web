name: Portfolio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portfolio-minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Disposable database (no hosted credentials)
        run: |
          docker run --name sachsach-hosted-defaults-tests --label purpose=sachsach-hosted-defaults-test -e POSTGRES_HOST_AUTH_METHOD=trust -d postgres:17.11
          for attempt in $(seq 1 30); do
            # The image starts a temporary socket-only server during initdb.
            # Wait for the final TCP listener, not that temporary socket.
            if docker exec sachsach-hosted-defaults-tests pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          docker exec sachsach-hosted-defaults-tests psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
      - run: npm run check:phase -- P10
      - run: npm run test:qr
      - run: npm run test:customer
      - run: npm run test:admin
      - run: npm run test:clarity
      - run: npm run test:pricing
      - run: npm run test:shop
