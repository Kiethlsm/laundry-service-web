name: Portfolio checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  phase-01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Disposable database (no hosted credentials)
        run: |
          docker run --name sachsach-hosted-defaults-tests --label purpose=sachsach-hosted-defaults-test -e POSTGRES_HOST_AUTH_METHOD=trust -d postgres:17.11
          for attempt in $(seq 1 30); do
            if docker exec sachsach-hosted-defaults-tests pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec sachsach-hosted-defaults-tests psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
